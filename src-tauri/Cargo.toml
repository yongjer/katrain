[package]
name = "katrain"
version = "2.0.0-alpha.1"
description = "Go/Baduk/Weiqi playing and teaching app with KataGo"
authors = ["Sander Land", "KaTrain contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "katrain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "0.1"
