name: Tauri app

on:
  push:
    branches: [tauri-v2]
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests-ts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:
    inputs:
      macos_runner:
        description: "macOS runner label (when the default Apple Silicon pool is short of capacity, e.g. macos-14)"
        default: macos-latest

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          - platform: ${{ inputs.macos_runner || 'macos-latest' }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v5
        with:
          name: katrain-tauri-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: ignore

  # Every push to tauri-v2 refreshes one public prerelease, "tauri-nightly", with the latest installers.
  nightly:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/tauri-v2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tauri-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: katrain-tauri-*
          path: bundles
          merge-multiple: true
      - name: Update the tauri-nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f tauri-nightly "$GITHUB_SHA"
          git push -f origin tauri-nightly
          notes="Automatic build of the Tauri port from the tauri-v2 branch, commit ${GITHUB_SHA}. Not a release: for testing only. macOS builds are unsigned."
          if gh release view tauri-nightly >/dev/null 2>&1; then
            gh release edit tauri-nightly --prerelease --title "KaTrain 2 nightly (tauri-v2)" --notes "$notes"
          else
            gh release create tauri-nightly --prerelease --title "KaTrain 2 nightly (tauri-v2)" --notes "$notes" --verify-tag
          fi
          mapfile -t files < <(find bundles -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \))
          printf '%s\n' "${files[@]}"
          gh release upload tauri-nightly "${files[@]}" --clobber
